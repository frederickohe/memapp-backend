definitions:
  services:
    docker:
      memory: 1024

pipelines:
  branches:
    main:
      - step:
          name: Build, Tag, and Push Backend Docker Image
          image: google/cloud-sdk:slim
          services:
            - docker
          caches:
            - maven
          script:
            - export ARTIFACT_REGISTRY_PATH_BACKEND=us-east1-docker.pkg.dev/deployment-testing-460522/nexus-backend-image
            # 1. Authenticate to Google Artifact Registry
            - echo "Logging into Google Artifact Registry..."
            - echo $GCP_SA_KEY | base64 -d > /tmp/gcp-key.json
            - cat /tmp/gcp-key.json | docker login -u _json_key --password-stdin https://${ARTIFACT_REGISTRY_PATH_BACKEND%%/*}
            - rm /tmp/gcp-key.json

            # 2. Build the Maven project (skip tests for speed, remove -DskipTests to run tests)
            - apt-get update && apt-get install -y openjdk-17-jdk
            - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            - chmod +x ./mvnw
            - ./mvnw clean package -DskipTests

            # 3. Build Docker image
            - docker build -t $ARTIFACT_REGISTRY_PATH_BACKEND/$BITBUCKET_REPO_SLUG:$BITBUCKET_COMMIT .
            - docker tag $ARTIFACT_REGISTRY_PATH_BACKEND/$BITBUCKET_REPO_SLUG:$BITBUCKET_COMMIT $ARTIFACT_REGISTRY_PATH_BACKEND/$BITBUCKET_REPO_SLUG:latest

            # 4. Push Docker images
            - docker push $ARTIFACT_REGISTRY_PATH_BACKEND/$BITBUCKET_REPO_SLUG:$BITBUCKET_COMMIT
            - docker push $ARTIFACT_REGISTRY_PATH_BACKEND/$BITBUCKET_REPO_SLUG:latest

            - echo "Backend Docker image pushed successfully."
