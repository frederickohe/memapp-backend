# Ymca Member App backend stack.
# Requires external Docker network "memapp" — create with:
#   cd ../memappcaddy && ./setup-networks.sh
# All services join "memapp" so Caddy can reach API/pgAdmin and they can reach db/redis.

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ymcaadmin
      POSTGRES_PASSWORD: ymca098
      POSTGRES_DB: ymca
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - memapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ymcaadmin -d ymca"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: memappredis
    restart: always
    command: redis-server --requirepass ymca098
    environment:
      REDIS_PASSWORD: ymca098
    volumes:
      - redis_data:/data
    networks:
      - memapp

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: memapp_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ymemberapp.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-ymca098}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - memapp

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memapp_backend
    restart: unless-stopped
    working_dir: /app
    command: bash startup.sh
    volumes:
      - .:/app
    environment:
      PGHOST: ${PGHOST:-db}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-ymcaadmin}
      PGPASSWORD: ${PGPASSWORD:-ymca098}
      PGDATABASE: ${PGDATABASE:-ymca}
      SQLALCHEMY_DATABASE_URL: "postgresql://ymcaadmin:ymca098@db:5432/ymca"
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ymca098}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-green-secret-keeps-gamma}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      DEBUG: ${DEBUG:-false}
      DB_ECHO: ${DB_ECHO:-false}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      BASE_FRONTEND_URL: ${BASE_FRONTEND_URL:-https://ymemberapp.com}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://api.ymemberapp.com}

      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-paystack}
      MONTHLY_DUES_AMOUNT_GHS: ${MONTHLY_DUES_AMOUNT_GHS:-20}
      ANNUAL_AFFILIATION_AMOUNT_GHS: ${ANNUAL_AFFILIATION_AMOUNT_GHS:-0}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-}

      # Moolre SMS Configuration
      MOOLRE_API_URL: ${MOOLRE_API_URL:-https://api.moolre.com}
      MOOLRE_API_USER: ${MOOLRE_API_USER:-}
      MOOLRE_API_KEY: ${MOOLRE_API_KEY:-}
      MOOLRE_API_PUBKEY: ${MOOLRE_API_PUBKEY:-}
      MOOLRE_VAS_KEY: ${MOOLRE_VAS_KEY:-}
      MOOLRE_ACCOUNT_NUMBER: ${MOOLRE_ACCOUNT_NUMBER:-}
      MOOLRE_SENDER_ID: ${MOOLRE_SENDER_ID:-YMemberApp}
      MOOLRE_CALLBACK_URL: ${MOOLRE_CALLBACK_URL:-}
      MOOLRE_MERCHANT_CODE: ${MOOLRE_MERCHANT_CODE:-}
      MOOLRE_USSD_SHORT_CODE: ${MOOLRE_USSD_SHORT_CODE:-*920*48#}
      MOOLRE_DEFAULT_CHANNEL: ${MOOLRE_DEFAULT_CHANNEL:-13}
    depends_on:
      - db
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - memapp

volumes:
  redis_data:
  postgres_data:
  pgadmin_data:
    driver: local

networks:
  memapp:
    external: true
    name: memapp
